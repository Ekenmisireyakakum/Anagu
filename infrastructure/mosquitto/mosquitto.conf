# Eclipse Mosquitto Configuration — ANAGU MQTT Broker
# WARNING: allow_anonymous=true is for DEVELOPMENT ONLY
# In production, set allow_anonymous=false and configure
# authentication with password_file or auth_plugin

# Standard MQTT listener
listener 1883
protocol mqtt

# WebSocket listener (for browser/mobile MQTT over WebSocket)
listener 9001
protocol websockets

# Access control
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Message size limit: 10 MB (matches API upload limit)
message_size_limit 10485760
