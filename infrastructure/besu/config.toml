# Hyperledger Besu QBFT Network Configuration
# Chain ID: 1337 (ANAGU development network)

# Networking
host-allowlist=["*"]

# JSON-RPC HTTP
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-cors-origins=["*"]
rpc-http-api=["ETH","NET","WEB3","QBFT","ADMIN","TXPOOL"]

# JSON-RPC WebSocket
rpc-ws-enabled=true
rpc-ws-host="0.0.0.0"
rpc-ws-api=["ETH","NET","WEB3","QBFT"]

# Sync and performance
sync-mode="FULL"
min-gas-price=0

# Logging
logging="INFO"
